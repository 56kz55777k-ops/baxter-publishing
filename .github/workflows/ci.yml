# CI — introduced with Native Publishing Slice A (blueprint amendment A3).
# Typecheck, lint, unit tests, production build, bundle budget. The public
# env values are placeholders: nothing here talks to a live service; the
# build only needs the variables to exist.
name: CI

on:
  pull_request:
  push:
    branches: [main, 'slice-*']

# The repository default for GITHUB_TOKEN is already read-only, but declaring
# it here means a later settings change cannot silently widen what CI can do.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
    steps:
      # Third-party actions are pinned to full-length commit SHAs, not tags.
      # A tag is a movable pointer: whoever can move `v4` can change what runs
      # here, with our GITHUB_TOKEN, on every push. A SHA cannot be moved.
      # The trailing comment keeps the human-readable version visible. There
      # is no dependabot.yml for github-actions, so nothing bumps these
      # automatically: re-pin by hand from the upstream release tag (resolve
      # it with `git ls-remote --tags`); never paste a SHA from a search
      # result. Both majors below run on the Node 24 actions runtime.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          # Match the Vercel project's Node.js version (Settings → Build and
          # Deployment), so CI tests the runtime production builds on.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx tsc -p apps/web/tsconfig.test.json
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm run budget -w @baxter/web
